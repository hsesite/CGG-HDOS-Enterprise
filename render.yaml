services:
  # Backend API Server
  - type: web
    name: hdos-backend
    runtime: node
    plan: free
    region: singapore
    branch: build-29-production-foundation
    buildCommand: npm install -g bun && bun install
    startCommand: bun run server:start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: CORS_ORIGINS
        value: https://hdos-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: hdos-database
          property: connectionString
      - key: SESSION_TTL_HOURS
        value: 12
      - key: SEED_ADMIN_EMAIL
        value: admin@ptcgg.com
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_ADMIN_NAME
        value: HDOS System Administrator

  # Frontend Static Site
  - type: web
    name: hdos-frontend
    runtime: static
    plan: free
    region: singapore
    branch: build-29-production-foundation
    buildCommand: npm install -g bun && bun install && VITE_API_URL=https://hdos-backend.onrender.com bun run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://hdos-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: hdos-database
    plan: free
    region: singapore
    databaseName: hdos
    user: hdos
