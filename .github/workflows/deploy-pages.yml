name: Deploy HDOS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck frontend
        run: bun run typecheck
      - name: Typecheck backend services
        run: bun run typecheck:server
      - name: Run regression tests
        run: bun run test:gas
      - name: Validate production configuration
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VITE_GAS_URL" ]; then
            echo "::error::Repository secret VITE_GAS_URL belum dikonfigurasi."
            exit 1
          fi
          case "$VITE_GAS_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo "::error::VITE_GAS_URL harus berupa URL deployment Google Apps Script /exec."; exit 1 ;;
          esac
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Repository secret VITE_GOOGLE_CLIENT_ID belum dikonfigurasi."
            exit 1
          fi
          case "$VITE_GOOGLE_CLIENT_ID" in
            *-*.apps.googleusercontent.com) ;;
            *) echo "::error::Format VITE_GOOGLE_CLIENT_ID tidak valid."; exit 1 ;;
          esac
      - name: Build frontend
        env:
          GITHUB_PAGES: 'true'
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: bun run build
      - name: Validate PWA production artifacts
        run: node scripts/validate-pwa-build.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
