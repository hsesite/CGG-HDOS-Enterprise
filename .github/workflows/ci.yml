name: HDOS validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, authorization tests, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck frontend and backend
        run: bun run lint

      - name: Run GAS authorization tests
        run: bun run test:gas

      - name: Build frontend
        run: bun run build
      - name: Validate PWA production artifacts
        run: node scripts/validate-pwa-build.mjs
